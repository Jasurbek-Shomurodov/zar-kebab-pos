name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The restaurant's business day is Asia/Tashkent, and three dashboard
      # analytics tests build local-time dates on that assumption; on the
      # runner's UTC clock they land on the previous business day.
      TZ: Asia/Tashkent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails on a known high or critical vulnerability in a package the app ships.
      - run: npm audit --omit=dev --audit-level=high
      # Every test, including the PGlite (embedded PostgreSQL in WebAssembly)
      # migration tests, which need no system package; then the coverage floor
      # in scripts/coverage-floor.json.
      - run: npm run test:coverage
      - run: npm run docs:check
      - run: npm run build
